---
name: Nilla OS
id: nilla
stages:
  - id: build
    base: ghcr.io/vanilla-os/core:latest
    singlelayer: false
    labels:
      maintainer: self-maintained
    args:
      DEBIAN_FRONTEND: noninteractive
    runs:
      commands:
        - echo 'APT::Install-Recommends "1";' >
          /etc/apt/apt.conf.d/01norecommends
    modules:
      - name: init-setup
        type: shell
        commands:
          - lpkg --unlock
          - apt-get update
      - name: networking
        type: apt
        source: null
        packages:
          - tailscale
          - wireguard-tools
          - openvpn3-client
          - network-manager-openvpn
      - name: backup
        type: apt
        source:
          packages:
            - restic
            - rclone
            - rclone-browser
      - name: terminal-tools
        type: apt
        source:
          packages:
            - fastfetch
            - wl-clipboard
            - gpg
      - name: diagnostics
        type: apt
        source:
          packages:
            - wireshark
            - wavemon
            - linssid
            - iotop
            - powertop
      - name: cosmic-repo
        type: shell
        commands:
          - mkdir -p /etc/apt/keyrings
          - curl -fsSL https://lcheylus.github.io/cosmic-debian/gpg.key -o
            /etc/apt/keyrings/cosmic-debian-keyring.asc
          - echo "deb [arch=amd64
            signed-by=/etc/apt/keyrings/cosmic-debian-keyring.asc]
            https://lcheylus.github.io/cosmic-debian/ forky main" >
            /etc/apt/sources.list.d/cosmic-debian.list
          - apt-get update
      - name: cosmic
        type: apt
        source:
          packages:
            - cosmic-session
            - cosmic-files
            - cosmic-term
            - cosmic-store
            - gnome-keyring
      - name: connectivity
        type: apt
        source:
          packages:
            - nautilus-kdeconnect
            - nautilus-nextcloud
      - name: set-image-name-abroot
        type: includes
        includes:
          - modules/80-set-image-abroot-config.yml
      - name: cleanup
        type: shell
        commands:
          - apt-get autoremove -y
          - apt-get clean
          - lpkg --lock
      - name: fsguard
        type: fsguard
        CustomFsGuard: false
        FsGuardLocation: /usr/sbin/FsGuard
        GenerateKey: true
        FilelistPaths:
          - /usr/bin
        modules:
          - name: remove-prev-fsguard
            type: shell
            commands:
              - rm -rf /FsGuard
              - rm -f ./minisign.pub ./minisign.key
              - chmod +x /usr/sbin/init
      - name: cleanup2
        type: shell
        commands:
          - rm -rf /tmp/*
          - rm -rf /var/tmp/*
          - rm -rf /sources
